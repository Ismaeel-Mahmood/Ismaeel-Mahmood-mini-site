    <footer>
      <!-- Formulaire de contact (même bloc dans toutes les pages) -->
      <section class="contact">
        <h2>Contact</h2>
        <!-- <form> : début du formulaire.
             action="msg.php" : fichier vers lequel les données sont envoyées à la soumission.
             method="post" : envoi des données dans le corps de la requête (pas dans l'URL). -->
        <form action="msg.php" method="post">
          <!-- <label for="..."> : étiquette liée au champ dont l'id est identique -->
          <label for="nom">Nom</label>
          <!-- type="text" : champ texte ; name="nom" : nom de la donnée envoyée ;
               required : champ obligatoire, le navigateur bloque l'envoi s'il est vide -->
          <input type="text" id="nom" name="nom" required />
          <label for="email">Email</label>
          <!-- type="email" : le navigateur vérifie le format d'une adresse email -->
          <input type="email" id="email" name="email" required />
          <label for="message">Message</label>
          <!-- <textarea> : zone de texte multiligne ; rows="4" : 4 lignes visibles -->
          <textarea id="message" name="message" rows="4" required></textarea>
          <!-- type="submit" : ce bouton envoie le formulaire -->
          <button type="submit">Envoyer</button>
        </form>
      </section>
